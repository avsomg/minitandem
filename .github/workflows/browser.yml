# Browser checks in Chromium and WebKit with an axe accessibility pass, on the built site. A workflow of its own: the unit tests
# (tests, test.yml) are what ops/deploy.sh requires and what the badge shows; a browser finding is fixed in the product, not by a
# red deploy gate. Clean checkout, no private editorial state, no model calls.
name: browser checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            editorial/package-lock.json
      - name: Install browser-check dependencies
        run: npm ci --ignore-scripts
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Install the pipeline dependencies
        run: npm ci
        working-directory: editorial
      - name: Install Chromium and WebKit (CI only)
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Build the public site
        id: build
        run: npm run build
      - name: Browser checks in Chromium (phone and desktop)
        run: npm run test:browser
        env:
          BROWSER_ENGINE: chromium
      - name: Browser checks in WebKit (phone and desktop)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run test:browser
        env:
          BROWSER_ENGINE: webkit
      - name: Save axe results and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: editorial/typesafe-runtime/browser-checks/
          if-no-files-found: ignore
          retention-days: 7
