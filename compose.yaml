# The site and the service behind Caddy with automatic HTTPS for minitandem.ch and www.minitandem.ch.
# Runs minitandem.ch since 14 October 2026. See docs/betrieb.md (German) for deploy, update, rollback, backup and restore.
name: minitandem

services:
  app:
    build:
      context: .
      args:
        MINITANDEM_FAMILY_SYNC: ${MINITANDEM_FAMILY_SYNC:-0}
    image: minitandem-app:${MINITANDEM_TAG:-current}
    restart: unless-stopped
    environment:
      # The service reads these; the image sets the same defaults.
      MINITANDEM_FAMILY_SYNC: ${MINITANDEM_FAMILY_SYNC:-0}
      MINITANDEM_STATE_DIR: /state
      MINITANDEM_CORRECTION_DIR: /state/corrections
      # /healthz reports it as "commit". The tag is the short commit id of the deployed version (.env.example), empty if unset.
      MINITANDEM_COMMIT: ${MINITANDEM_TAG:-}
    volumes:
      - state:/state
    expose:
      - "8787"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    # A fixed release, so a rebuild never picks up a new Caddy unseen. 2.11.7 was checked on the server on 17 October 2026
    # (sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f). Raise it on purpose, after caddy validate.
    image: caddy:2.11.7-alpine
    # Caddy runs as root inside the container only to bind ports 80 and 443; it keeps that one capability and nothing else.
    # Its data and config volumes belong to root, so it still writes certificates without DAC_OVERRIDE (tried 17 October 2026).
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/sh", "/etc/caddy/access-log-entrypoint.sh"]
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    tmpfs:
      - /var/log/caddy:size=32m,mode=0700
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env (copy .env.example)}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/access-log-entrypoint.sh:/etc/caddy/access-log-entrypoint.sh:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  # Family keys (hashed), family profiles, submitted corrections and the service's own rotating backups. Back this up.
  state:
  # Certificates and the ACME account. Losing it means new certificates (Let's Encrypt has rate limits). Back this up too.
  caddy-data:
  caddy-config:
